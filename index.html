<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><title>Sivakar — Diwali Crackers 2026</title><style>
:root{--bg:#fff8ef;--card:#fff;--text:#24160d;--muted:#7b6b5d;--line:#ead8c4;--soft:#fff0dc;--accent:#d94801;--ok:#16834a;--bad:#c62828}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#7f190c,#d94801,#f59e0b);color:#fff;padding:18px 14px;position:sticky;top:0;z-index:5}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:24px}.sub{font-size:12px;opacity:.9}.nav button{border:0;background:#fff;color:#8f1d0c;border-radius:10px;padding:9px 11px;font-weight:800}main{padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{font:inherit}input,select{border:1px solid var(--line);background:#fff;padding:10px;border-radius:10px;color:var(--text)}#search{flex:1;min-width:220px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.media{height:210px;background:#f4eadc;position:relative}.media img{width:100%;height:100%;object-fit:contain}.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.media.has-video:hover video{display:block}.body{padding:11px}.name{font-weight:850}.meta{color:var(--muted);font-size:11px;margin-top:3px}.price{font-weight:900;font-size:18px;margin-top:8px}.piece{font-size:12px;color:var(--muted)}.stock{font-size:12px;margin-top:6px}.ok{color:var(--ok)}.bad{color:var(--bad)}.controls{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-top:10px}.qty{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.qty button{width:34px;border:0;background:#fff0dc;font-weight:900}.qty input{width:100%;border:0;border-radius:0;text-align:center;min-width:0}.add{width:100%;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px;font-weight:850}.summary{position:sticky;bottom:10px;margin:16px auto 0;max-width:700px;background:#24160d;color:#fff;border-radius:16px;padding:13px;box-shadow:0 8px 30px #0003;display:flex;justify-content:space-between;gap:10px;align-items:center}.summary button{border:0;border-radius:10px;padding:10px 13px;font-weight:900}.checkout{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;max-width:700px;margin-left:auto;margin-right:auto}.checkout h2{margin:0 0 8px}.checkout .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checkout textarea{width:100%;min-height:70px}.place{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:#16834a;color:#fff;font-weight:900}.note{font-size:12px;color:var(--muted);line-height:1.5}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}@media(max-width:600px){h1{font-size:19px}.grid{grid-template-columns:1fr}.media{height:230px}.controls{grid-template-columns:105px 1fr}.checkout .row{grid-template-columns:1fr}
</style></head><body><header><div class="wrap top"><div><h1>🎆 SIVAKAR — DIWALI CRACKERS 2026</h1><div class="sub">Choose boxes or individual pieces • Live stock</div></div><div class="nav"><button onclick="location.href='admin.html'">Shop Admin</button></div></div></header><main class="wrap"><div id="banner" class="note" style="background:#fff3d8;border:1px solid #e7c98b;padding:11px;border-radius:12px;margin-bottom:12px">Connecting to catalogue…</div><div class="toolbar"><input id="search" placeholder="Search crackers…"><select id="category"><option value="">All categories</option></select></div><div id="tabs" class="tabs"></div><div id="grid" class="grid"></div><div class="summary"><div><div>Cart total</div><strong id="total">₹0.00</strong></div><button onclick="document.getElementById('checkout').scrollIntoView({behavior:'smooth'})">Review & Place Order</button></div><section id="checkout" class="checkout"><h2>Customer details</h2><div class="row"><input id="customerName" placeholder="Name *"><input id="customerPhone" placeholder="Phone *"></div><textarea id="address" placeholder="Delivery / pickup address"></textarea><textarea id="notes" placeholder="Notes"></textarea><p class="note">Stock is checked and deducted in the database when the order is successfully placed. The order number is then prepared for WhatsApp.</p><button class="place" onclick="placeOrder()">Place Order</button></section></main><script>
let products=[],cart=new Map(),db=null,activeCategory='';
function money(v){return '₹'+Number(v||0).toFixed(2)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function stockText(p){let b=Math.floor(p.stock_units/p.units_per_box),r=p.stock_units%p.units_per_box;return p.stock_units<=0?'Out of stock':(b+' boxes'+(r?' + '+r+' pieces':''))}
function maxFor(p,unit){return unit==='BOX'?Math.floor(p.stock_units/p.units_per_box):p.stock_units}
function render(){let q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('category').value||activeCategory;let list=products.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))&&(!c||p.category===c));document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No products found.</div>'}
function card(p){let item=cart.get(p.id)||{qty:0,unit:'BOX'};let max=maxFor(p,item.unit);let media=p.media_file?`<video muted loop playsinline preload="metadata" onloadeddata="this.parentElement.classList.add('has-video')"><source src="assets/media/${esc(p.media_file)}" type="video/mp4"></video>`:'';return `<article class="card"><div class="media"><img src="assets/images/${esc(p.image_file)}" alt="${esc(p.name)}" onerror="this.style.opacity=.15">${media}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.category)} • ${esc(p.catalog_unit||'')}</div><div class="price">${money(item.unit==='BOX'?p.box_price:p.box_price/p.units_per_box)} <span class="piece">/ ${item.unit.toLowerCase()}</span></div><div class="piece">1 box = ${p.units_per_box} pieces • Piece price ${money(p.box_price/p.units_per_box)}</div><div class="stock ${p.stock_units?'ok':'bad'}">${stockText(p)}</div><div class="controls"><select onchange="setUnit(${p.id},this.value)"><option ${item.unit==='BOX'?'selected':''}>BOX</option><option ${item.unit==='PIECE'?'selected':''}>PIECE</option></select><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button><input type="number" min="0" max="${max}" value="${item.qty}" onchange="typeQty(${p.id},this.value)"><button onclick="changeQty(${p.id},1)">+</button></div></div><button class="add" onclick="addOne(${p.id})">${item.qty?'Update quantity':'Add to cart'}</button></div></article>`}
function ensure(id){if(!cart.has(id))cart.set(id,{qty:0,unit:'BOX'});return cart.get(id)}
function setUnit(id,u){let x=ensure(id);x.unit=u;x.qty=Math.min(x.qty,maxFor(products.find(p=>p.id===id),u));render();updateTotal()}
function changeQty(id,d){let p=products.find(x=>x.id===id),x=ensure(id);x.qty=Math.max(0,Math.min(maxFor(p,x.unit),x.qty+d));render();updateTotal()}
function typeQty(id,v){let p=products.find(x=>x.id===id),x=ensure(id),n=Math.max(0,Math.floor(Number(v)||0)),max=maxFor(p,x.unit);if(n>max){alert(`Only ${max} ${x.unit.toLowerCase()} available for ${p.name}.`);n=max}x.qty=n;render();updateTotal()}
function addOne(id){let p=products.find(x=>x.id===id),x=ensure(id);if(x.qty===0){x.qty=Math.min(1,maxFor(p,x.unit))}render();updateTotal()}
function updateTotal(){let t=0;for(let [id,x] of cart){let p=products.find(y=>y.id===id);t+=x.qty*(x.unit==='BOX'?p.box_price:p.box_price/p.units_per_box)}document.getElementById('total').textContent=money(t)}
function populate(){let cats=[...new Set(products.map(p=>p.category))];document.getElementById('category').innerHTML='<option value=\"\">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');document.getElementById('tabs').innerHTML=`<button class=\"tab active\" onclick=\"chooseCat('')\">All</button>`+cats.map(c=>`<button class=\"tab\" onclick=\"chooseCat('${encodeURIComponent(c)}')\">${esc(c)}</button>`).join('')}
function chooseCat(c){activeCategory=decodeURIComponent(c);document.getElementById('category').value=activeCategory;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));render()}
async function load(){if(!isSupabaseConfigured()){document.getElementById('banner').textContent='Database not configured. Fill supabase-config.js first.';return}db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let {data,error}=await db.rpc('product_view');if(error){document.getElementById('banner').textContent='Database error: '+error.message;return}products=data||[];populate();render();updateTotal();document.getElementById('banner').textContent='Live catalogue connected to Supabase. Stock and prices come from the shop database.'}
async function placeOrder(){
  let items=[...cart.entries()]
    .filter(([id,x])=>x.qty>0)
    .map(([id,x])=>({id,qty:x.qty,unit:x.unit}));

  if(!items.length){
    alert('Add at least one item.');
    return;
  }

  let name=document.getElementById('customerName').value.trim();
  let phone=document.getElementById('customerPhone').value.trim();

  if(!name||!phone){
    alert('Please enter name and phone.');
    return;
  }

  let total=0;

  items.forEach(i=>{
    let p=products.find(x=>x.id===i.id);
    total+=i.qty*(i.unit==='BOX'
      ? p.box_price
      : p.box_price/p.units_per_box);
  });

  let {data,error}=await db.rpc('place_order',{
    p_customer_name:name,
    p_customer_phone:phone,
    p_address:document.getElementById('address').value,
    p_notes:document.getElementById('notes').value,
    p_items:items,
    p_total:total
  });

  if(error){
    alert(error.message);
    await load();
    return;
  }

  let orderNo=data;

  let message=`Sivakar Diwali Order
Order No: ${orderNo}
Name: ${name}
Phone: ${phone}

Items:`;

  items.forEach(i=>{
    let p=products.find(x=>x.id===i.id);
    let unitPrice=i.unit==='BOX'
      ? p.box_price
      : p.box_price/p.units_per_box;

    message+=`
${p.name} - ${i.qty} ${i.unit} @ ${money(unitPrice)}`;
  });

  message+=`

Total: ${money(total)}
Address: ${document.getElementById('address').value.trim() || 'Not provided'}
Notes: ${document.getElementById('notes').value.trim() || 'None'}`;

  cart.clear();
  await load();

  let shopNumber =
    (typeof SHOP !== 'undefined' && SHOP.whatsapp)
      ? SHOP.whatsapp
      : '918885909297';

  let whatsappUrl =
    'https://wa.me/' +
    shopNumber +
    '?text=' +
    encodeURIComponent(message);

  window.open(whatsappUrl,'_blank');
}document.getElementById('search').oninput=render;document.getElementById('category').onchange=e=>{activeCategory=e.target.value;render()};load();
</script></body></html>
